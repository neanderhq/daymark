contract_version: 1
id: calendly
title: Daymark
description: >-
  Share reusable booking pages, one-off links and meeting polls with your
  availability. Neander provisions managed sign-in, private profile photos,
  booking emails and scheduled meeting reminders. Invitees can download a
  calendar file and manage their booking from its private receipt.
category: Scheduling
best_for: Consultants and teams coordinating meetings
features:
  - Multiple reusable booking pages
  - Availability and booking rules
  - Meeting polls
  - One-off booking links
  - Contacts
  - Calendar file downloads
  - Managed sign-in and private profile photos
  - Booking confirmation and change emails
  - Meeting reminders five minutes before the start
included:
  - Daymark scheduling application
  - PostgreSQL migrations
  - Fictional sample data
  - Managed-service Compose declaration and reminder function
thumbnail: .neander/thumbnail.png
screenshots:
  - .neander/gallery/reusable-booking-pages.png
  - .neander/gallery/booking-email-and-calendar-download.png
  - .neander/gallery/calendar-download-on-phone.png
commands:
  install: [pnpm, install, --frozen-lockfile]
  check: [pnpm, run, check]
  test: [pnpm, run, test]
  verify: [pnpm, run, test:template]
seed:
  command: [pnpm, run, db:seed]
