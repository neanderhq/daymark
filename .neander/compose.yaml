services:
  web:
    build:
      context: ..
      dockerfile: .neander/Dockerfile
    ports: ["8080:8080"]
    secrets: [neander_environment]
    x-google-cloudrun:
      ingress-container: true
secrets:
  neander_environment:
    file: /run/neander/secrets/neander_environment
x-neander:
  contract_version: 2
  managed_services:
    web: [auth, storage, email, scheduling]
  functions:
    booking-reminder:
      source: lambda
      runtime: nodejs22.x
      handler: booking-reminder.handler
      managed_services: [email]
      environment:
        DAYMARK_APP_URL:
          binding: public_origin
  ingress:
    service: web
    port: 8080
    root_probe: /
  environment:
    - service: web
      name: DATABASE_URL
      required: true
      source: provisioned
      provider: Neon
    - service: web
      name: DAYMARK_APP_URL
      required: true
      source: provisioned
      provider: Neander
      binding: public_origin
    - service: web
      name: DAYMARK_APP_SECRET
      required: true
      source: generated
      provider: null
      generator: opaque-random
    - service: web
      name: DAYMARK_REMINDER_FUNCTION_ARN
      required: true
      source: provisioned
      provider: Neander
      binding: function_arn
      resource: booking-reminder
  probes:
    - path: /api/health
      success_status_range: 2xx
  migration: nextjs-drizzle
